version: 1
required_common_fields:
  - summary
  - decision
  - reasons
  - artifacts
  - next_action
  - log
  - status

agent_specific_fields:
  planner:
    - work_type
    - scope
    - sections
    - required_agents
    - required_skills
    - approval_request
  publisher:
    - ui_structure
    - reusable_components_found
    - new_components_needed
    - event_interface_points
    - handoff_to_generator_or_refactorer
  generator:
    - implementation_summary
    - reused_assets
    - newly_created_assets
    - validation_points
    - known_risks
    - handoff_to_watcher
  refactorer:
    - refactor_targets
    - applied_changes
    - deferred_improvements
    - risk_notes
    - handoff_to_watcher
  watcher:
    - review_result
    - pass_fail
    - violations
    - required_fixes
    - repeat_issue_detected
    - escalation_needed
  evaluator:
    - diagnosis_report
    - architectural_risks
    - improvement_options
    - recommended_backlog
    - handoff_to_planner_optional
  harness-hook:
    - can_proceed
    - missing_requirements
    - role_violation_detected
    - approval_status
    - retry_count
    - escalation_signal

status_values:
  base:
    - draft
    - ready_for_approval
    - approved
    - in_progress
    - review_requested
    - rejected
    - escalated
    - completed
    - deferred
  evaluator_extension:
    - recommendation_ready
    - handed_off
